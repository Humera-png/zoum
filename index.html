<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      Static fallbacks for crawlers that don't run JS (WhatsApp, LinkedIn and
      Facebook link previews). Tagged data-static-head and removed by the app
      on mount, so each route's own title/description from the router wins.
    -->
    <title data-static-head>Career & Business Consultancy in Jaipur, Ahmedabad & India | ZOUM</title>
    <meta data-static-head name="description" content="Consultancy in Jaipur and Ahmedabad for job placement across India, BPO operations, career courses, AI automation, and website development." />
    <meta data-static-head property="og:title" content="Career & Business Consultancy in Jaipur, Ahmedabad & India | ZOUM" />
    <meta data-static-head property="og:description" content="Job placement across India, career courses, BPO operations, AI automation and website development from Jaipur." />
    <meta data-static-head property="og:image" content="https://zoumconsultancy.com/assets/zoum-logo.png" />
    <meta data-static-head property="og:url" content="https://zoumconsultancy.com" />
    <meta data-static-head property="og:type" content="website" />
    <!--
      Favicons live in the static HTML (not the router head) for the same
      reason as AdSense below: Google's favicon crawler reads the raw HTML
      and doesn't run JS. Google needs a square icon that's a multiple of
      48px, so the 48/96/192 PNGs are listed explicitly.
    -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#00C755" />
    <!--
      Google AdSense: hardcoded directly in the static HTML (not injected
      via React/TanStack Router head management) because this app is a
      client-rendered SPA — the AdSense site-verification crawler fetches
      the raw HTML and doesn't run the JS that would otherwise add this tag,
      so the router-managed version never got seen and verification failed.
    -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-2748464050751133"
      crossorigin="anonymous"
    ></script>
    <meta name="google-adsense-account" content="ca-pub-2748464050751133" />
  </head>

  <body class="bg-[#FAFAFA] text-[#14241B]">
    <div id="root"></div>

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
